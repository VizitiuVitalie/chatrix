name: chatrix-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatrix_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
    ports:
      - '${POSTGRES_PORT:-5532}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../src/core/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: chatrix_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - net

volumes:
  pgdata:
    name: chatrix_pgdata_dev
  miniodata:
    name: chatrix_miniodata_dev

networks:
  net:
    name: chatrix_net_dev
    driver: bridge
