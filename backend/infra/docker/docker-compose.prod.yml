name: chatrix-prod

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatrix_postgres_prod
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../src/core/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: chatrix_minio_prod
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - net

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    image: chatrix-backend:prod
    container_name: chatrix_backend_prod
    restart: unless-stopped
    init: true
    logging: *logging
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - net

  nginx:
    image: nginx:1.31.1-alpine
    container_name: chatrix_nginx_prod
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/html:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - net

volumes:
  pgdata:
    name: chatrix_pgdata_prod
  miniodata:
    name: chatrix_miniodata_prod

networks:
  net:
    name: chatrix_net_prod
    driver: bridge
