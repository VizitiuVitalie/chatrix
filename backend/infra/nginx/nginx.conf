map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:4321 resolve;
    keepalive 32;
}

upstream minio_upstream {
    zone minio_upstream 64k;
    server minio:9000 resolve;
}

server {
    listen      80 default_server;
    server_name _;

    client_max_body_size 26m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml application/xml+rss
                    image/svg+xml;

    location /socket.io/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
    }

    location /storage/ {
        proxy_pass         http://minio_upstream/chatrix-files-prod/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
    }

    location = /index.html {
        root       /usr/share/nginx/html;
        add_header  Cache-Control "no-store" always;
    }

    location = /version.json {
        root       /usr/share/nginx/html;
        default_type application/json;
        add_header  Cache-Control "no-store" always;
    }

    location = /sw.js {
        root       /usr/share/nginx/html;
        add_header  Cache-Control "no-cache" always;
    }
    
    location /assets/ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header  Cache-Control "public, immutable" always;
        try_files  $uri =404;
    }

    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
